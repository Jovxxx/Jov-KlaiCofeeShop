<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Login</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="customer_login.css">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase Configuration -->
    <script src="supabase.js"></script>
</head>

<body>

    <a href="index.html" class="back-link">← Back</a>

    <div class="login-box">

        <h2 class="head-text">Customer Login</h2>
        <p class="subtitle">
            Welcome back! Login to order your favorite drinks and food.
        </p>

        <form id="loginForm" novalidate>

            <!-- Email -->
            <div class="form-row">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required>
            </div>

            <!-- Password -->
            <div class="form-row">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password">

                        Show

                    </button>

                </div>

            </div>

            <!-- Status Message -->
            <p id="message"></p>

            <!-- Login Button -->
            <button
                type="submit"
                id="submitBtn"
                class="login-btn">

                Login

            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="customer_register.html">

                Register here

            </a>

        </div>

    </div>

    <!-- Login Logic -->
    <script src="customer_login.js"></script>

</body>

</html>
